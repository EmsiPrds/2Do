<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2Do — a clean, minimal task manager built around your focus. Capture tasks, stay on track, and get things done." />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F8F8" media="(prefers-color-scheme: light)" />
    <title>2Do — Get things done</title>
    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark = stored ? stored === "dark" : true;
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = "#080808";
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.style.backgroundColor = "#F8F8F8";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
